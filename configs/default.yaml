# Default experiment settings, taken from proposal Chapter 3.

seed: 42

data:
  root: data/raw
  processed: data/processed
  window_seconds: 4          # tuned between 2 and 8 s on validation
  frames_per_window: 10
  video_offset_s: auto       # video start minus EEG start in seconds; "auto" = from EDF + timestamp files

labels:
  # DROZY / field data: session KSS rating
  kss_decline_min: 7         # KSS >= 7 -> vigilance decline, <= 6 -> alert
  # SEED-VIG
  perclos_decline_min: 0.35
  minority_class_weight_threshold: 0.30   # use class-weighted loss below this

eeg:
  channels: [Fz, Cz, C3, C4, Pz]   # DROZY EEG montage
  resample_hz: 128           # from 512 Hz; keeps the model light for the Jetson
  reject_ptp_uv: 150         # windows above this peak-to-peak amplitude are flagged
  bandpass_hz: [0.5, 45.0]
  notch_hz: 50.0             # Ugandan mains frequency (DROZY was recorded in Belgium, also 50 Hz)
  bands:
    delta: [0.5, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]

face:
  crop_size: 64
  features: [ear, mar, blink_rate, head_pose, perclos]

fusion:
  strategies: [early, late, hybrid]

distillation:
  # Teacher: the best fusion strategy (early fusion) scaled up; Student: same
  # strategy with reduced width (proposal 3.7.3-3.7.4).
  teacher:
    strategy: early
    hidden: 128
    eeg: {f1: 16, depth: 2, f2: 32}     # EEGNet-16,2
    face: {width: 32, hidden: 128}
  student:
    strategy: early
    hidden: 24
    eeg: {f1: 4, depth: 2, f2: 8}       # EEGNet-4,2
    face: {width: 8, hidden: 24}
  student_mid:                          # ~74% smaller than the Teacher; same size as early_fusion
    strategy: early
    hidden: 64
    eeg: {f1: 8, depth: 2, f2: 16}      # EEGNet-8,2
    face: {width: 16, hidden: 64}
  temperatures: [2, 4, 8]
  alphas: [0.3, 0.5, 0.7]
  target_size_reduction: 0.70

evaluation:
  split: loso                # leave-one-subject-out on DROZY
  significance: 0.05
  latency_target_ms: 100
